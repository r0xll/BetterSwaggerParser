name: release

# Cut a GitHub Release with the built extension jar attached.
# Triggered by pushing a version tag (e.g. v1.0.0), or manually via the
# Actions tab (workflow_dispatch) with a version string.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (without the leading v), e.g. 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace -PreleaseVersion=${{ steps.version.outputs.value }}

      - name: Create release and upload jar
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: BetterSwaggerParser v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/BetterSwaggerParser-${{ steps.version.outputs.value }}.jar
